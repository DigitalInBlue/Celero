name: CMake on multiple platforms

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        build_type: [Debug, Release]
        compiler:
          # ubuntu-latest is 26.04: GCC 13 through 15 and Clang 20 through 22.
          - name: gcc-13
            cc: gcc-13
            cxx: g++-13
          - name: gcc-14
            cc: gcc-14
            cxx: g++-14
          - name: gcc-15
            cc: gcc-15
            cxx: g++-15
          - name: clang-20
            cc: clang-20
            cxx: clang++-20
          - name: clang-21
            cc: clang-21
            cxx: clang++-21
          - name: clang-22
            cc: clang-22
            cxx: clang++-22
          - name: cl
            cc: cl
            cxx: cl
          - name: appleclang
            cc: clang
            cxx: clang++
        exclude:
          # MSVC only on Windows
          - os: ubuntu-latest
            compiler:
              name: cl
          - os: macos-latest
            compiler:
              name: cl
          # GCC/Clang versioned compilers not on Windows
          - os: windows-latest
            compiler:
              name: gcc-13
          - os: windows-latest
            compiler:
              name: gcc-14
          - os: windows-latest
            compiler:
              name: gcc-15
          - os: windows-latest
            compiler:
              name: clang-20
          - os: windows-latest
            compiler:
              name: clang-21
          - os: windows-latest
            compiler:
              name: clang-22
          # AppleClang only on macOS
          - os: ubuntu-latest
            compiler:
              name: appleclang
          - os: windows-latest
            compiler:
              name: appleclang
          # GCC/Clang versioned compilers not on macOS
          - os: macos-latest
            compiler:
              name: gcc-13
          - os: macos-latest
            compiler:
              name: gcc-14
          - os: macos-latest
            compiler:
              name: gcc-15
          - os: macos-latest
            compiler:
              name: clang-20
          - os: macos-latest
            compiler:
              name: clang-21
          - os: macos-latest
            compiler:
              name: clang-22

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          cxx="${{ matrix.compiler.cxx }}"
          case "$cxx" in
            g++-*) pkg="$cxx" ;;
            clang++-*) pkg="clang-${cxx#clang++-}" ;;
            *) echo "::error::No apt package for ${cxx}"; exit 1 ;;
          esac
          sudo apt-get install -y --no-install-recommends "$pkg"

      # vcpkg must be built with the same compiler that later links the tests.
      # A gtest archive from the image's default GCC references symbols the
      # older matrix compilers do not provide.
      - name: Select compiler for vcpkg
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "CC=${{ matrix.compiler.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.compiler.cxx }}" >> "$GITHUB_ENV"

      # The action otherwise checks out the latest vcpkg release, which can be
      # older than builtin-baseline. Read the baseline so the checkout and the
      # manifest always name the same commit.
      - name: Read vcpkg baseline
        id: vcpkg-baseline
        shell: bash
        run: |
          baseline=$(sed -n 's/.*"builtin-baseline"[[:space:]]*:[[:space:]]*"\([0-9a-f]\{40\}\)".*/\1/p' vcpkg.json)
          if [ -z "$baseline" ]; then
            echo "::error::vcpkg.json builtin-baseline must be a 40-character commit."
            exit 1
          fi
          echo "revision=$baseline" >> "$GITHUB_OUTPUT"

      - name: Setup vcpkg
        id: vcpkg
        uses: johnwason/vcpkg-action@v8
        with:
          manifest-dir: ${{ github.workspace }}
          revision: ${{ steps.vcpkg-baseline.outputs.revision }}
          triplet: >-
            ${{
              matrix.os == 'windows-latest' && 'x64-windows' ||
              matrix.os == 'macos-latest' && 'arm64-osx' ||
              'x64-linux'
            }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        env:
          CC: ${{ matrix.compiler.cc }}
          CXX: ${{ matrix.compiler.cxx }}
        run: |
          cmake -S . -B build \
            ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCELERO_ENABLE_TESTS=ON \
            -DCELERO_ENABLE_EXPERIMENTS=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B build ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCELERO_ENABLE_TESTS=ON -DCELERO_ENABLE_EXPERIMENTS=ON

      - name: Verify C++11 language mode (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          python3 - << 'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("build/compile_commands.json")
          if not path.is_file():
              sys.exit("compile_commands.json was not generated")
          entries = json.loads(path.read_text())
          if not entries:
              sys.exit("compile_commands.json is empty")
          bad = []
          for entry in entries:
              command = entry.get("command")
              if command is None:
                  command = " ".join(entry.get("arguments", []))
              if "-std=c++11" not in command.split():
                  bad.append(entry["file"])
          if bad:
              print("These translation units are not compiled with -std=c++11:")
              print("\n".join(bad))
              sys.exit(1)
          print(f"C++11 confirmed for {len(entries)} translation units")
          PY

      - name: Verify C++11 CMake standard (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # CMAKE_CXX_STANDARD is a normal variable in CMakeLists.txt, so it is
          # not written to CMakeCache.txt. The generated projects are the proof:
          # MSVC has no /std:c++11, and Celero selects /std:c++14 instead.
          $projects = Get-ChildItem -Path build -Recurse -Filter *.vcxproj |
            Where-Object { $_.FullName -notmatch '\\vcpkg' }
          if (-not $projects) {
            Write-Error "No Visual Studio projects were generated"
            exit 1
          }
          $newer = @()
          $missing = @()
          foreach ($proj in $projects) {
            $text = Get-Content -Raw $proj.FullName
            if ($text -match 'stdcpp17|stdcpp20|stdcpp23|stdcpplatest|[/-]std:c\+\+(17|20|23|latest)') {
              $newer += $proj.FullName
            }
            if ($proj.Name -match '^(celero|Celero)') {
              if ($text -notmatch '[/-]std:c\+\+14' -and $text -notmatch 'stdcpp14') {
                $missing += $proj.FullName
              }
            }
          }
          if ($newer.Count -gt 0) {
            Write-Error ("Projects compiled above MSVC's oldest mode:`n" + ($newer -join "`n"))
            exit 1
          }
          if ($missing.Count -gt 0) {
            Write-Error ("Celero projects are missing /std:c++14:`n" + ($missing -join "`n"))
            exit 1
          }
          Write-Host "MSVC projects use CMake standard 11 and /std:c++14"

      - name: Build
        shell: bash
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run tests
        shell: bash
        run: |
          cd build
          ctest --output-on-failure -C ${{ matrix.build_type }}

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install clang
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-22

      - name: Read vcpkg baseline
        id: vcpkg-baseline
        shell: bash
        run: |
          baseline=$(sed -n 's/.*"builtin-baseline"[[:space:]]*:[[:space:]]*"\([0-9a-f]\{40\}\)".*/\1/p' vcpkg.json)
          if [ -z "$baseline" ]; then
            echo "::error::vcpkg.json builtin-baseline must be a 40-character commit."
            exit 1
          fi
          echo "revision=$baseline" >> "$GITHUB_OUTPUT"

      - name: Setup vcpkg
        id: vcpkg
        uses: johnwason/vcpkg-action@v8
        env:
          CC: clang-22
          CXX: clang++-22
        with:
          manifest-dir: ${{ github.workspace }}
          revision: ${{ steps.vcpkg-baseline.outputs.revision }}
          triplet: x64-linux
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure with AddressSanitizer
        shell: bash
        env:
          CC: clang-22
          CXX: clang++-22
        run: |
          cmake -S . -B build \
            ${{ steps.vcpkg.outputs.vcpkg-cmake-config }} \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCELERO_ENABLE_TESTS=ON \
            -DCELERO_ENABLE_EXPERIMENTS=ON \
            -DCELERO_ENABLE_CLANG_ADDRESS_SANITIZER=ON

      - name: Verify C++11 language mode
        shell: bash
        run: |
          python3 - << 'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("build/compile_commands.json")
          if not path.is_file():
              sys.exit("compile_commands.json was not generated")
          entries = json.loads(path.read_text())
          if not entries:
              sys.exit("compile_commands.json is empty")
          bad = []
          for entry in entries:
              command = entry.get("command")
              if command is None:
                  command = " ".join(entry.get("arguments", []))
              if "-std=c++11" not in command.split():
                  bad.append(entry["file"])
          if bad:
              print("These translation units are not compiled with -std=c++11:")
              print("\n".join(bad))
              sys.exit(1)
          print(f"C++11 confirmed for {len(entries)} translation units")
          PY

      - name: Build
        shell: bash
        run: cmake --build build --config Debug

      - name: Run tests under ASAN
        shell: bash
        run: |
          cd build
          ctest --output-on-failure -C Debug
